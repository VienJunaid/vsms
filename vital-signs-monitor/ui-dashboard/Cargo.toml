[package]
name = "ui-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ui-dashboard-cli"
path = "src/main.rs"

[[bin]]
name = "ui-dashboard-qt"
path = "src/qt/main.rs"
required-features = ["qt-ui"]


[dependencies]
protocol = { path = "../protocol" }

# cxx-qt is intentionally NOT a default dependency. It requires Qt5/Qt6 dev
# packages installed on the build machine (present on the reTerminal's BSP,
# NOT present in this sandbox). Enable with `--features qt-ui` once building
# on the reTerminal or a dev machine with Qt installed. See ui-dashboard/README.md.
[dependencies.cxx-qt]
version = "0.6"
optional = true

[dependencies.cxx-qt-lib]
version = "0.6"
optional = true

[build-dependencies.cxx-qt-build]
version = "0.6"
optional = true

[features]
qt-ui = ["cxx-qt", "cxx-qt-lib", "cxx-qt-build"]
